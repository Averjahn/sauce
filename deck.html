<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>дека — соус</title>
<meta name="description" content="дека для скейтборда — соус">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 C10 13 7 18 7 22 a9 9 0 0 0 18 0 C25 18 22 13 16 3 Z' fill='%23000'/%3E%3C/svg%3E">
<style>
  :root{
    --ink:#000;
    --whisper:#b9b9b9;
    --ghost:#dcdcdc;
    --ease:cubic-bezier(.16,.7,.3,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:#fff;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Inter",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:6vh 24px;
  }

  .back{
    position:fixed;
    top:26px;
    left:30px;
    font-size:.7rem;
    letter-spacing:.1em;
    color:var(--ghost);
    text-decoration:none;
    transition:color .3s var(--ease);
  }
  .back:hover{color:var(--whisper)}

  .title{
    font-size:clamp(1.05rem,2.4vw,1.35rem);
    font-weight:400;
    letter-spacing:.42em;
    text-indent:.42em;
    animation:rise 1s var(--ease) both;
    margin-bottom:clamp(32px,6vh,64px);
  }

  .piece{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
    animation:rise 1.15s var(--ease) both;
  }

  .deckWrap{
    height:min(60vh,600px);
    filter:drop-shadow(0 30px 40px rgba(0,0,0,.08));
  }
  .deckWrap svg{display:block;height:100%;width:auto;margin:0 auto}

  .caption{
    font-size:.78rem;
    letter-spacing:.14em;
    color:var(--whisper);
    text-align:center;
  }

  @keyframes rise{
    from{opacity:0;transform:translateY(14px)}
    to{opacity:1;transform:none}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
  <a class="back" href="./">← соус</a>

  <div class="title">дека</div>

  <div class="piece">
    <div class="deckWrap">
      <svg viewBox="0 0 200 764" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="deckClip">
            <path d="M100 4
                     C140 4 158 22 162 60
                     L172 220
                     C176 260 178 300 178 382
                     C178 464 176 504 172 544
                     L162 704
                     C158 742 140 760 100 760
                     C60 760 42 742 38 704
                     L28 544
                     C24 504 22 464 22 382
                     C22 300 24 260 28 220
                     L38 60
                     C42 22 60 4 100 4 Z"/>
          </clipPath>
        </defs>
        <path d="M100 4
                 C140 4 158 22 162 60
                 L172 220
                 C176 260 178 300 178 382
                 C178 464 176 504 172 544
                 L162 704
                 C158 742 140 760 100 760
                 C60 760 42 742 38 704
                 L28 544
                 C24 504 22 464 22 382
                 C22 300 24 260 28 220
                 L38 60
                 C42 22 60 4 100 4 Z"
              fill="#fff" stroke="#e6e6e6" stroke-width="1.5"/>
        <g clip-path="url(#deckClip)">
          <image href="sauce.jpg?v=2" x="44" y="150" width="112" height="304" preserveAspectRatio="xMidYMid meet"/>
          <text x="100" y="706" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Helvetica Neue,Arial,sans-serif" font-size="18" letter-spacing="7" fill="#000">соус</text>
        </g>
      </svg>
    </div>
    <div class="caption">8.25″</div>
  </div>
</body>
</html>
