<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>дека — соус</title>
<meta name="description" content="дека для скейтборда — соус">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 C10 13 7 18 7 22 a9 9 0 0 0 18 0 C25 18 22 13 16 3 Z' fill='%23000'/%3E%3C/svg%3E">
<style>
  :root{
    --ink:#000;
    --whisper:#b9b9b9;
    --ghost:#dcdcdc;
    --ease:cubic-bezier(.16,.7,.3,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:#fff;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Inter",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:6vh 24px;
  }

  .back{
    position:fixed;
    top:26px;
    left:30px;
    font-size:.7rem;
    letter-spacing:.1em;
    color:var(--ghost);
    text-decoration:none;
    transition:color .3s var(--ease);
  }
  .back:hover{color:var(--whisper)}

  .title{
    font-size:clamp(1.05rem,2.4vw,1.35rem);
    font-weight:400;
    letter-spacing:.42em;
    text-indent:.42em;
    animation:rise 1s var(--ease) both;
    margin-bottom:clamp(32px,6vh,64px);
  }

  .piece{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
    animation:rise 1.15s var(--ease) both;
  }

  .deckWrap{
    height:min(60vh,600px);
    filter:drop-shadow(0 30px 40px rgba(0,0,0,.08));
  }
  .deckWrap svg{display:block;height:100%;width:auto;margin:0 auto}

  .caption{
    font-size:.78rem;
    letter-spacing:.14em;
    color:var(--whisper);
    text-align:center;
  }

  @keyframes rise{
    from{opacity:0;transform:translateY(14px)}
    to{opacity:1;transform:none}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
  <a class="back" href="./">← соус</a>

  <div class="title">дека</div>

  <div class="piece">
    <div class="deckWrap">
      <svg viewBox="0 0 200 618" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="deckClip">
            <path d="M100 4
                     C142 4 178 32 180 72
                     L180 546
                     C178 586 142 614 100 614
                     C58 614 22 586 20 546
                     L20 72
                     C22 32 58 4 100 4 Z"/>
          </clipPath>
          <linearGradient id="concave" x1="0" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0%"   stop-color="#000" stop-opacity=".4"/>
            <stop offset="16%"  stop-color="#000" stop-opacity=".14"/>
            <stop offset="34%"  stop-color="#000" stop-opacity="0"/>
            <stop offset="66%"  stop-color="#000" stop-opacity="0"/>
            <stop offset="84%"  stop-color="#000" stop-opacity=".14"/>
            <stop offset="100%" stop-color="#000" stop-opacity=".4"/>
          </linearGradient>
          <linearGradient id="concaveHi" x1="0" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0%"   stop-color="#fff" stop-opacity="0"/>
            <stop offset="26%"  stop-color="#fff" stop-opacity=".55"/>
            <stop offset="50%"  stop-color="#fff" stop-opacity="0"/>
            <stop offset="74%"  stop-color="#fff" stop-opacity=".55"/>
            <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <path d="M100 4
                 C142 4 178 32 180 72
                 L180 546
                 C178 586 142 614 100 614
                 C58 614 22 586 20 546
                 L20 72
                 C22 32 58 4 100 4 Z"
              fill="#fff" stroke="#e6e6e6" stroke-width="1.5"/>
        <g clip-path="url(#deckClip)">
          <image href="sauce.jpg?v=2" x="55" y="187" width="90" height="244" preserveAspectRatio="xMidYMid meet"/>
          <text x="100" y="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Helvetica Neue,Arial,sans-serif" font-size="14" letter-spacing="5" fill="#000">соус</text>
        </g>
        <!-- concave shading: deep, high-concave scoop suggested via rail shadow + wall highlight -->
        <g clip-path="url(#deckClip)">
          <rect x="0" y="0" width="200" height="618" fill="url(#concave)" style="mix-blend-mode:multiply"/>
          <rect x="0" y="0" width="200" height="618" fill="url(#concaveHi)" style="mix-blend-mode:screen" opacity=".45"/>
        </g>
        <!-- truck mounting bolts, for the "unmistakably a skateboard" read -->
        <g fill="none" stroke="#d8d8d8" stroke-width="1.4">
          <circle cx="83"  cy="57"  r="3.4"/>
          <circle cx="117" cy="57"  r="3.4"/>
          <circle cx="83"  cy="84"  r="3.4"/>
          <circle cx="117" cy="84"  r="3.4"/>
          <circle cx="83"  cy="561" r="3.4"/>
          <circle cx="117" cy="561" r="3.4"/>
          <circle cx="83"  cy="534" r="3.4"/>
          <circle cx="117" cy="534" r="3.4"/>
        </g>
      </svg>
    </div>
    <div class="caption">standard shape<br>8.25″ · high concave</div>
  </div>
</body>
</html>
