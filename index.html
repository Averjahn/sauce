<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>соус</title>
<meta name="description" content="соус">
<meta name="theme-color" content="#ffffff">
<meta property="og:title" content="соус">
<meta property="og:description" content="соус">
<meta property="og:image" content="sauce.jpg">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 C10 13 7 18 7 22 a9 9 0 0 0 18 0 C25 18 22 13 16 3 Z' fill='%23000'/%3E%3C/svg%3E">
<style>
  :root{
    --ink:#000;
    --whisper:#b9b9b9;
    --ghost:#dcdcdc;
    --ease:cubic-bezier(.16,.7,.3,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:#fff;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Inter",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    padding:6vh 24px;
  }

  /* single edition tag, top corner */
  .tag{
    position:fixed;
    top:26px;
    right:30px;
    font-size:.7rem;
    letter-spacing:.22em;
    color:var(--whisper);
    text-transform:lowercase;
    animation:rise 1s var(--ease) 1.15s both;
  }

  main{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(28px,5vh,52px);
  }

  .stage{
    animation:rise 1.15s var(--ease) both;
  }
  .stage img{
    display:block;
    height:min(58vh,660px);
    width:auto;
    max-width:82vw;
    object-fit:contain;
    user-select:none;
    -webkit-user-drag:none;
  }

  .plate{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }

  .word{
    font-size:clamp(1.05rem,2.4vw,1.35rem);
    font-weight:400;
    letter-spacing:.42em;
    /* nudge for optical centering (letter-spacing pads the right) */
    text-indent:.42em;
    color:var(--ink);
    animation:rise 1s var(--ease) .5s both;
  }

  .buy{
    font-size:.82rem;
    letter-spacing:.03em;
    color:var(--whisper);
    display:flex;
    align-items:center;
    gap:.6em;
    min-height:1.2em;
    transition:opacity .32s var(--ease);
    animation:rise 1s var(--ease) .8s both;
  }
  .buy .dot{color:var(--ghost)}
  .buy button{
    font:inherit;
    letter-spacing:inherit;
    color:var(--ink);
    background:none;
    border:0;
    padding:0;
    cursor:pointer;
    position:relative;
  }
  .buy button::after{
    content:"";
    position:absolute;
    left:0;right:0;bottom:-3px;
    height:1px;
    background:var(--ink);
    transform:scaleX(0);
    transform-origin:left;
    transition:transform .4s var(--ease);
  }
  .buy button:hover::after,
  .buy button:focus-visible::after{transform:scaleX(1)}
  .buy button:focus{outline:none}
  .buy.fade{opacity:0}
  .buy.done{color:var(--ink);letter-spacing:.28em;text-indent:.28em}

  .credit{
    position:fixed;
    bottom:16px;
    left:0;right:0;
    text-align:center;
    font-size:.6rem;
    letter-spacing:.04em;
    color:var(--ghost);
    animation:rise 1s var(--ease) 1.3s both;
  }
  .credit a{color:inherit;text-decoration:none}
  .credit a:hover{color:var(--whisper)}

  @keyframes rise{
    from{opacity:0;transform:translateY(14px)}
    to{opacity:1;transform:none}
  }

  @media (max-width:480px){
    .stage img{height:auto;width:min(66vw,320px)}
    .tag{top:18px;right:20px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
  <div class="tag" id="tag">1 / 1</div>

  <main>
    <figure class="stage">
      <img src="sauce.jpg" alt="соус" draggable="false" width="883" height="1024">
    </figure>

    <div class="plate">
      <div class="word">соус</div>
      <p class="buy" id="buy">
        <span id="price">1&thinsp;000&nbsp;₽</span>
        <span class="dot">·</span>
        <button type="button" id="cta" aria-label="купить">купить</button>
      </p>
    </div>
  </main>

  <p class="credit">
    фото · <a href="https://commons.wikimedia.org/wiki/File:Kikkoman_soysauce.jpg" target="_blank" rel="noopener">Creative&nbsp;Tools</a> · <a href="https://creativecommons.org/licenses/by/2.0/" target="_blank" rel="noopener">CC&nbsp;BY&nbsp;2.0</a>
  </p>

  <script>
    (function(){
      var buy = document.getElementById('buy');
      var cta = document.getElementById('cta');
      var tag = document.getElementById('tag');
      if(!cta) return;
      cta.addEventListener('click', function(){
        buy.classList.add('fade');
        window.setTimeout(function(){
          buy.textContent = 'спасибо.';
          buy.classList.remove('fade');
          buy.classList.add('done');
          tag.textContent = 'продано';
        }, 320);
      });
    })();
  </script>
</body>
</html>
