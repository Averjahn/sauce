<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>соус</title>
<meta name="description" content="соус">
<meta name="theme-color" content="#ffffff">
<meta property="og:title" content="соус">
<meta property="og:description" content="соус">
<meta property="og:image" content="sauce.jpg">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 C10 13 7 18 7 22 a9 9 0 0 0 18 0 C25 18 22 13 16 3 Z' fill='%23000'/%3E%3C/svg%3E">
<style>
  :root{
    --ink:#000;
    --whisper:#b9b9b9;
    --ghost:#dcdcdc;
    --ease:cubic-bezier(.16,.7,.3,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:#fff;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Inter",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    padding:6vh 24px;
  }

  main{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(28px,5vh,52px);
  }

  .stage{
    animation:rise 1.15s var(--ease) both;
  }
  .stage img{
    display:block;
    height:min(58vh,660px);
    width:auto;
    max-width:82vw;
    object-fit:contain;
    user-select:none;
    -webkit-user-drag:none;
  }

  .plate{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }

  .word{
    font-size:clamp(1.05rem,2.4vw,1.35rem);
    font-weight:400;
    letter-spacing:.42em;
    /* nudge for optical centering (letter-spacing pads the right) */
    text-indent:.42em;
    color:var(--ink);
    animation:rise 1s var(--ease) .5s both;
  }

  .buy{
    font-size:.82rem;
    letter-spacing:.03em;
    color:var(--whisper);
    display:flex;
    align-items:center;
    gap:.6em;
    min-height:1.2em;
    transition:opacity .32s var(--ease);
    animation:rise 1s var(--ease) .8s both;
  }
  .buy .dot{color:var(--ghost)}
  .buy button{
    font:inherit;
    letter-spacing:inherit;
    color:var(--ink);
    background:none;
    border:0;
    padding:0;
    cursor:pointer;
    position:relative;
  }
  .buy button::after{
    content:"";
    position:absolute;
    left:0;right:0;bottom:-3px;
    height:1px;
    background:var(--ink);
    transform:scaleX(0);
    transform-origin:left;
    transition:transform .4s var(--ease);
  }
  .buy button:hover::after,
  .buy button:focus-visible::after{transform:scaleX(1)}
  .buy button:focus{outline:none}
  .buy.fade{opacity:0}
  .buy.done{color:var(--ink);letter-spacing:.28em;text-indent:.28em}

  @keyframes rise{
    from{opacity:0;transform:translateY(14px)}
    to{opacity:1;transform:none}
  }

  @media (max-width:480px){
    .stage img{height:auto;width:min(66vw,320px)}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }

  #sauceTrail{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:50;
    mix-blend-mode:multiply;
    filter:url(#sauceWobble);
  }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="sauceWobble" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence id="sauceNoise" type="fractalNoise" baseFrequency="0.014 0.02" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <canvas id="sauceTrail" aria-hidden="true"></canvas>

  <main>
    <figure class="stage">
      <img src="sauce.jpg?v=2" alt="соус" draggable="false" width="443" height="1200">
    </figure>

    <div class="plate">
      <div class="word">соус</div>
      <p class="buy" id="buy">
        <span id="price">1&thinsp;000&nbsp;₽</span>
        <span class="dot">·</span>
        <button type="button" id="cta" aria-label="купить">купить</button>
      </p>
    </div>
  </main>

  <script>
    (function(){
      var buy = document.getElementById('buy');
      var cta = document.getElementById('cta');
      if(!cta) return;
      cta.addEventListener('click', function(){
        buy.classList.add('fade');
        window.setTimeout(function(){
          buy.textContent = 'спасибо.';
          buy.classList.remove('fade');
          buy.classList.add('done');
        }, 320);
      });
    })();
  </script>

  <script>
    (function(){
      var canvas = document.getElementById('sauceTrail');
      if(!canvas || !canvas.getContext) return;
      var ctx = canvas.getContext('2d', {alpha:true});
      if(!ctx) return;

      var DPR = Math.min(window.devicePixelRatio || 1, 2);
      var W = 0, H = 0;

      function resize(){
        W = canvas.width  = Math.max(1, Math.floor(innerWidth  * DPR));
        H = canvas.height = Math.max(1, Math.floor(innerHeight * DPR));
        canvas.style.width  = innerWidth + 'px';
        canvas.style.height = innerHeight + 'px';
      }
      resize();
      window.addEventListener('resize', resize);

      function rand(a, b){ return a + Math.random() * (b - a); }

      var last = null;      // {x,y,t} in device px
      var pressure = 0.2;   // builds while dwelling, sells "pooling" sauce
      var queue = [];
      var fadeTS = null;
      var active = false;   // has the user ever moved? avoids idle work
      var idleTimer = null;

      function wake(){
        active = true;
        if(idleTimer) clearTimeout(idleTimer);
        idleTimer = setTimeout(function(){ active = false; }, 4000);
      }

      function pushPoint(x, y){
        queue.push({ x: x * DPR, y: y * DPR, t: performance.now() });
        if(queue.length > 60) queue.shift(); // guard against runaway backlog
        wake();
      }

      window.addEventListener('pointermove', function(e){
        pushPoint(e.clientX, e.clientY);
      }, { passive:true });

      window.addEventListener('touchmove', function(e){
        var t = e.touches && e.touches[0];
        if(t) pushPoint(t.clientX, t.clientY);
      }, { passive:true });

      function dab(x, y, r, dx, dy, speed){
        var ang = Math.atan2(dy, dx);
        var stretch = Math.min(1 + speed * 1.6, 2.4);

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(ang);
        ctx.scale(stretch, 1);

        // irregular blob body — a few offset ellipses read as one viscous smear
        var n = 3;
        for(var i = 0; i < n; i++){
          var ox = rand(-r * 0.22, r * 0.22);
          var oy = rand(-r * 0.22, r * 0.22);
          var rr = r * rand(0.78, 1.05);
          var g = ctx.createRadialGradient(ox, oy, 0, ox, oy, rr);
          g.addColorStop(0,    'rgba(120,15,9,0.94)');
          g.addColorStop(0.55, 'rgba(179,27,16,0.86)');
          g.addColorStop(1,    'rgba(179,27,16,0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.ellipse(ox, oy, rr, rr * 0.85, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        // chili-flake specks, echoing the product's texture
        if(Math.random() < 0.55){
          var fn = 1 + Math.floor(Math.random() * 2);
          for(var j = 0; j < fn; j++){
            ctx.fillStyle = 'rgba(34,9,5,' + rand(0.35, 0.6).toFixed(2) + ')';
            ctx.beginPath();
            ctx.ellipse(rand(-r*0.55, r*0.55), rand(-r*0.45, r*0.45), rand(0.6,1.5)*DPR, rand(0.6,1.5)*DPR, rand(0,6.28), 0, 6.28);
            ctx.fill();
          }
        }

        // wet glossy highlight
        var prevOp = ctx.globalCompositeOperation;
        ctx.globalCompositeOperation = 'lighter';
        var hg = ctx.createRadialGradient(-r*0.28, -r*0.32, 0, -r*0.28, -r*0.32, r*0.5);
        hg.addColorStop(0, 'rgba(255,214,170,0.5)');
        hg.addColorStop(1, 'rgba(255,214,170,0)');
        ctx.fillStyle = hg;
        ctx.beginPath();
        ctx.ellipse(-r*0.28, -r*0.32, r*0.5, r*0.4, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.globalCompositeOperation = prevOp;

        ctx.restore();
      }

      function processQueue(){
        var q = queue;
        queue = [];
        for(var k = 0; k < q.length; k++){
          var p = q[k];
          if(last){
            var dx = p.x - last.x, dy = p.y - last.y;
            var dist = Math.sqrt(dx*dx + dy*dy);
            var dt = Math.min(120, Math.max(1, p.t - last.t));
            var speed = dist / dt; // device px per ms

            pressure = speed < 0.12 ? Math.min(pressure + 0.05, 1) : Math.max(pressure - 0.10, 0.18);
            var baseR = (7 + pressure * 15) * DPR;
            var spacing = Math.max(3 * DPR, baseR * 0.35);
            var steps = Math.min(40, Math.max(1, Math.floor(dist / spacing)));

            for(var i = 1; i <= steps; i++){
              var t = i / steps;
              dab(last.x + dx*t, last.y + dy*t, baseR * rand(0.85, 1.15), dx, dy, speed);
            }
          } else {
            dab(p.x, p.y, 9 * DPR, 0, 0, 0);
          }
          last = p;
        }
      }

      function step(now){
        if(queue.length) processQueue();

        if(active){
          if(fadeTS == null) fadeTS = now;
          var fdt = now - fadeTS;
          fadeTS = now;
          var HALF_LIFE = 9000; // stain "dries"/fades over roughly this span
          var fadeAlpha = 1 - Math.pow(0.5, fdt / HALF_LIFE);
          ctx.save();
          ctx.globalCompositeOperation = 'destination-out';
          ctx.fillStyle = 'rgba(0,0,0,' + fadeAlpha.toFixed(4) + ')';
          ctx.fillRect(0, 0, W, H);
          ctx.restore();
        } else {
          fadeTS = null;
        }

        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    })();
  </script>
</body>
</html>
